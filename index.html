<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMINE AI STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:#17181d;padding:22px 15px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:20px;font-weight:bold;color:#9b8cff;margin:8px 5px 25px}
.nav{border:0;background:transparent;color:#bbb;text-align:left;padding:13px;border-radius:10px;cursor:pointer;font-size:15px}
.nav:hover,.nav.active{background:#292a34;color:white}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:65px;border-bottom:1px solid #292a30;display:flex;align-items:center;padding:0 25px;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:25px max(20px,calc((100% - 850px)/2))}
.welcome{text-align:center;margin:12vh auto 35px}
.welcome h1{font-size:32px;margin-bottom:10px}
.welcome p{color:#999}
.message{padding:15px 18px;border-radius:15px;margin:15px 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#292a35;margin-left:12%;border:1px solid #393a46}
.ai{background:#1a1b20;margin-right:12%;border:1px solid #292a30}
.composer-area{padding:15px 20px 22px;max-width:900px;width:100%;margin:auto}
.composer{display:flex;align-items:flex-end;gap:10px;background:#202127;border:1px solid #3b3c46;border-radius:18px;padding:12px}
textarea{flex:1;background:transparent;color:white;border:0;outline:0;resize:none;font-size:16px;min-height:45px;max-height:160px;padding:12px}
.send{background:#9b8cff;color:#111;border:0;border-radius:12px;padding:13px 18px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.5}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.tools button{background:#202127;color:#ccc;border:1px solid #383943;padding:9px 12px;border-radius:9px;cursor:pointer}
.tools button:hover{background:#30313b}
#fileInput{display:none}
.preview{max-width:180px;max-height:130px;border-radius:10px;margin-top:10px}
@media(max-width:650px){
.sidebar{width:65px;padding:15px 7px}
.logo{font-size:11px;overflow:hidden}
.nav{font-size:0;text-align:center;padding:13px 2px}
.nav::first-letter{font-size:18px}
.chat{padding:15px}
.user,.ai{margin-left:0;margin-right:0}
.welcome h1{font-size:25px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">✦ AMINE AI</div>
  <button class="nav active" onclick="showChat()">💬 AI Chat</button>
  <button class="nav" onclick="document.getElementById('fileInput').click()">🖼️ Image Tools</button>
  <button class="nav" onclick="openCamera()">📷 Camera</button>
  <button class="nav" onclick="startVoice()">🎙️ Voice Studio</button>
  <button class="nav" onclick="document.getElementById('fileInput').click()">📁 My Files</button>
</aside>

<main class="main">
  <header class="top">AMINE AI STUDIO</header>

  <section class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>Welcome to AMINE AI ✨</h1>
      <p>How can I help you today?</p>
    </div>
  </section>

  <section class="composer-area">
    <div class="composer">
      <textarea id="prompt" placeholder="Message AMINE AI..." rows="1"></textarea>
      <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="tools">
      <button onclick="document.getElementById('fileInput').click()">＋ Add file</button>
      <button onclick="openCamera()">📷 Camera</button>
      <button onclick="startVoice()">🎙️ Voice</button>
    </div>
    <input id="fileInput" type="file" accept="image/*,.pdf,.txt" onchange="previewFile(event)">
    <div id="previewArea"></div>
  </section>
</main>

<script>
const promptBox = document.getElementById('prompt');
const chat = document.getElementById('chat');
const sendBtn = document.getElementById('sendBtn');

promptBox.addEventListener('input', () => {
  promptBox.style.height = 'auto';
  promptBox.style.height = Math.min(promptBox.scrollHeight,160) + 'px';
});

promptBox.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function addMessage(text, type){
  const welcome = document.getElementById('welcome');
  if(welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage(){
  const message = promptBox.value.trim();
  if(!message) return;

  addMessage(message,'user');
  promptBox.value = '';
  promptBox.style.height = '45px';
  sendBtn.disabled = true;

  const loading = addMessage('AMINE AI is thinking...','ai');

  try{
    const response = await fetch(
      'https://weathered-fog-39fb.mantouraneamine.workers.dev',
      {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:message})
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'Request failed');
    }

    loading.textContent = data.answer || 'No answer received.';
  }catch(error){
    loading.textContent = 'Connection error: ' + error.message;
  }finally{
    sendBtn.disabled = false;
    promptBox.focus();
  }
}

function showChat(){
  promptBox.focus();
}

function previewFile(event){
  const file = event.target.files[0];
  if(!file) return;

  const area = document.getElementById('previewArea');
  area.innerHTML = '';

  if(file.type.startsWith('image/')){
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.className = 'preview';
    area.appendChild(img);
  }else{
    area.textContent = 'Selected file: ' + file.name;
  }
}

let cameraStream;

async function openCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:true});
    const old = document.getElementById('cameraPreview');
    if(old) old.remove();

    const video = document.createElement('video');
    video.id = 'cameraPreview';
    video.srcObject = cameraStream;
    video.autoplay = true;
    video.style.cssText = 'width:100%;max-width:400px;margin:15px;border-radius:12px';
    chat.appendChild(video);
  }catch(error){
    addMessage('Camera could not be opened: ' + error.message,'ai');
  }
}

function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    addMessage('Voice input is not supported in this browser.','ai');
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.onresult = event => {
    promptBox.value += event.results[0][0].transcript;
    promptBox.focus();
  };
  recognition.start();
}
</script>
</body>
</html>
